<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O QUE É A REALIDADE NO DIGITAL</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f4f6f9;
    color:#333;
    line-height:1.8;
}

header{
    background:#4f46e5;
    color:white;
    text-align:center;
    padding:40px 20px;
}

header h1{
    font-size:2.5rem;
}

header p{
    margin-top:10px;
}

.container{
    max-width:1000px;
    margin:40px auto;
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.info{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
    margin-bottom:30px;
}

.card{
    background:#eef2ff;
    padding:15px;
    border-radius:10px;
}

h2{
    color:#4f46e5;
    margin:30px 0 15px;
}

.questao{
    background:#fafafa;
    border-left:5px solid #4f46e5;
    padding:20px;
    margin:20px 0;
    border-radius:10px;
}

textarea{
    width:100%;
    min-height:250px;
    padding:15px;
    border:2px solid #d1d5db;
    border-radius:10px;
    resize:vertical;
    font-size:16px;
    margin-top:10px;
    outline:none;
    font-family:'Poppins',sans-serif;
}

textarea:focus{
    border-color:#4f46e5;
    box-shadow:0 0 10px rgba(79,70,229,0.2);
}

footer{
    text-align:center;
    padding:20px;
    margin-top:30px;
    color:#666;
}

.botao{
    display:block;
    width:220px;
    margin:30px auto;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#4f46e5;
    color:white;
    cursor:pointer;
    font-size:16px;
}

.botao:hover{
    opacity:0.9;
}
</style>
</head>
<body>

<header>
    <h1>O QUE É A REALIDADE NO DIGITAL</h1>
    <p>Trabalho desenvolvido em HTML</p>
</header>

<div class="container">

    <div class="info">
        <div class="card"><strong>Aluno:</strong> João Vitor</div>
        <div class="card"><strong>Turma:</strong> 2º Ano Técnico</div>
        <div class="card"><strong>Disciplina:</strong> Sistemas Operacionais</div>
    </div>

    <h2>Introdução</h2>

    <textarea placeholder="Digite aqui a introdução da atividade..."></textarea>

    <h2>Desenvolvimento</h2>

    <div class="questao">
        <h3>TEXTO</h3>
        <textarea placeholder="Digite aqui o texto principal da atividade..."></textarea>
    </div>

    <div class="questao">
        <h3>PERGUNTAS</h3>
        <textarea placeholder="Digite aqui as perguntas..."></textarea>
    </div>

    <div class="questao">
        <h3>RESPOSTAS</h3>
        <textarea placeholder="Digite aqui as respostas..."></textarea>
    </div>

    <h2>Conclusão</h2>

    <textarea placeholder="Digite aqui a conclusão do trabalho..."></textarea>

    <button class="botao" onclick="window.print()">
        Imprimir / Salvar PDF
    </button>

</div>

<footer>
    © 2026 - Trabalho Escolar de João Vitor
</footer>

</body>
</html>
